# =========================================
# Dental Clinic System - Log Rotation Config
# =========================================
#
# HOW TO INSTALL:
#   sudo cp dental-clinic-logrotate.conf /etc/logrotate.d/dental-clinic
#
# HOW TO TEST (dry run):
#   sudo logrotate --debug /etc/logrotate.d/dental-clinic
#
# HOW TO FORCE RUN:
#   sudo logrotate --force /etc/logrotate.d/dental-clinic
# =========================================

# MySQL Health Check Log
# Runs every hour, grows fast, rotate weekly
/home/ivylxvie/backups/logs/mysql-health.log {
    su ivylxvie ivylxvie
    weekly
    rotate 4
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 0644 ivylxvie ivylxvie
}

# MySQL Auto-Repair Log
# Runs daily, grows slower, rotate monthly
/home/ivylxvie/backups/logs/mysql-auto-repair.log {
    su ivylxvie ivylxvie
    monthly
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 0644 ivylxvie ivylxvie
}

# Backup Script Log
# Runs daily, grows slower, rotate monthly
/home/ivylxvie/backups/logs/backup-dental.log {
    su ivylxvie ivylxvie
    monthly
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    dateext
    create 0644 ivylxvie ivylxvie
}
