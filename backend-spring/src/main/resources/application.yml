server:
  port: ${SPRING_API_PORT:8081}

spring:
  datasource:
    url: ${DB_URL:}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000

security:
  jwt:
    secret: ${JWT_SECRET:change-this-jwt-secret-in-production-32chars-min}
    expires-minutes: ${JWT_EXPIRES_MINUTES:60}
